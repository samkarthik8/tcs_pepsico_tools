<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TCS PepsiCo Tools</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                    135deg,
                    #003DA5 0%,
                    #005CB9 35%,
                    #E32934 100%
            );
        }

        .container {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-out;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;

            border-radius: 50%;

            background: radial-gradient(
                    circle,
                    #ffffff 0%,
                    #d9ecff 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5),
            0 0 60px rgba(255, 255, 255, 0.25);

            animation: pulse 2s infinite ease-in-out,
            rotate 8s linear infinite;
        }

        .logo-circle span {
            font-size: 42px;
            font-weight: 900;
            color: #003DA5;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;

            background: linear-gradient(
                    90deg,
                    #ffffff,
                    #d8ecff,
                    #ffffff
            );

            background-size: 300% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shimmer 3s linear infinite;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
        }

        .loading {
            width: 320px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            margin: auto;
        }

        .loading-bar {
            height: 100%;
            width: 40%;
            border-radius: 999px;

            background: white;

            animation: loading 1.5s infinite ease-in-out;
        }

        .version {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.8;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

<div class="container">



    <h1>TCS PepsiCo Tools</h1>


    <div class="loading">
        <div class="loading-bar"></div>
    </div>

    <div class="version">
        Version 1.2.0
    </div>

</div>

</body>
</html>
